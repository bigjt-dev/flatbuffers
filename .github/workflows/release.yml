name: Release

permissions:
  contents: write

on:
  # For manual tests.
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-shared.yml

  publish-nuget:
    name: Publish NuGet
    runs-on: ubuntu-24.04
    needs: build
    defaults:
      run:
        working-directory: ./net/FlatSpanBuffers
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v4.2.0
      with:
        dotnet-version: '10.0.x'
    - name: Build
      run: dotnet build FlatSpanBuffers.csproj -c Release
    - name: Pack
      run: dotnet pack FlatSpanBuffers.csproj -c Release
    - name: Upload to NuGet
      run: dotnet nuget push ./bin/Release/FlatSpanBuffers.*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json

  upload-release-assets:
    name: Upload Release Assets
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'release'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts
        pattern: '*flatspan binary*'

    - name: Package release binaries
      run: |
        mkdir -p release-files
        zip -j "release-files/Linux.flatspan.binary.g++-13.zip"      "./artifacts/Linux flatspan binary g++-13/"*
        zip -j "release-files/Linux.flatspan.binary.clang++-18.zip"  "./artifacts/Linux flatspan binary clang++-18/"*
        zip -j "release-files/MacIntel.flatspan.binary.zip"          "./artifacts/Mac flatspan binary Intel/"*
        zip -j "release-files/Mac.flatspan.binary.zip"               "./artifacts/Mac flatspan binary Universal/"*
        zip -j "release-files/Windows.flatspan.binary.zip"           "./artifacts/Windows flatspan binary/"*
        ls -la release-files/

    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for f in release-files/*.zip; do
          gh release upload "${{ github.event.release.tag_name }}" "$f" --repo "${{ github.repository }}"
        done
